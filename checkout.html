<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ShopKart - Checkout</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<div class="topbar">

<a href="index.html" class="logo">
Shop<span>Kart</span>
</a>

</div>

</header>

<section class="checkout">

<h2>Checkout</h2>

<form onsubmit="placeOrder(event)">

<input
type="text"
placeholder="Full Name"
required
>

<input
type="text"
placeholder="Address"
required
>

<input
type="text"
placeholder="City"
required
>

<input
type="text"
placeholder="PIN Code"
required
>

<select required>

<option value="">
Select Payment Method
</option>

<option>
Cash on Delivery
</option>

<option>
UPI
</option>

<option>
Card
</option>

</select>

<button type="submit">
Place Order
</button>

</form>

</section>

<script src="js/script.js"></script>

</body>

</html>
